<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /*
   * Tokens repris tels quels du <style> inline de index.html : la carte doit
   * pouvoir se poser à côté d'une capture de la landing sans qu'on voie la
   * couture. Toute retouche de charte se fait là-bas d'abord, ici ensuite.
   */
  :root {
    --bg: #07060c;
    --surface: rgba(255,255,255,0.04);
    --surface-2: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #f5f3ff;
    --text-muted: rgba(245,243,255,0.62);
    --text-dim: rgba(245,243,255,0.42);
    --violet: #9146FF;
    --violet-2: #B68CFF;
    --magenta: #FF4FB8;
    --cyan: #4FE3FF;
    --green: #44FFB1;
    --red: #FF4D6D;
    --display: 'Space Grotesk', 'Outfit', system-ui, sans-serif;
    --sans: 'Outfit', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow: hidden;
  }

  /* ── Atmosphère ───────────────────────────────
     Les trois blobs de .atmosphere, figés à mi-course de leur animation. */
  .blob { position: absolute; border-radius: 50%; filter: blur(120px); }
  .b1 { width: 720px; height: 720px; background: radial-gradient(circle, #6E2BFF 0%, transparent 60%); top: -240px; left: -200px; opacity: .55; }
  .b2 { width: 640px; height: 640px; background: radial-gradient(circle, #FF4FB8 0%, transparent 60%); top: -120px; right: -220px; opacity: .35; }
  .b3 { width: 540px; height: 540px; background: radial-gradient(circle, #4FE3FF 0%, transparent 60%); bottom: -320px; left: 30%; opacity: .18; }

  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,0.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,0.025) 1px, transparent 1px);
    background-size: 80px 80px;
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 42% 35%, black 30%, transparent 80%);
  }
  .noise {
    position: absolute; inset: 0; opacity: .04; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* La barre de progression de la landing, épaissie pour rester visible en vignette. */
  .topline {
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--violet), var(--magenta), var(--cyan));
    box-shadow: 0 0 12px rgba(145,70,255,0.6);
  }

  /* ── Layout ─────────────────────────────────── */
  .wrap {
    position: relative; z-index: 5;
    width: 100%; height: 100%;
    padding: 54px 64px 50px;
    display: grid;
    grid-template-columns: 1fr 470px;
    gap: 44px;
    align-items: center;
  }
  .left { display: flex; flex-direction: column; align-self: stretch; }

  /* .nav-brand : le logo nu avec son halo, pas de pastille autour. */
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 42px; height: 42px; filter: drop-shadow(0 0 12px rgba(145,70,255,0.55)); }
  .brand .name {
    font-family: var(--display); font-weight: 600;
    font-size: 28px; letter-spacing: -0.02em;
  }

  .eyebrow {
    margin-top: 26px; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 10px;
    background: rgba(145,70,255,0.08);
    border: 1px solid rgba(145,70,255,0.25);
    border-radius: 100px;
    font-size: 14px; font-weight: 500; color: var(--violet-2);
  }
  .eyebrow .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--violet); box-shadow: 0 0 0 4px rgba(145,70,255,0.15);
  }

  h1 {
    margin-top: 20px;
    font-family: var(--display);
    font-size: 56px;
    font-weight: 600;
    line-height: 0.98;
    letter-spacing: -0.035em;
  }
  h1 .gradient {
    background: linear-gradient(120deg, #B68CFF 0%, #9146FF 35%, #FF4FB8 75%, #FF7AB8 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 em {
    font-family: var(--sans); font-style: italic; font-weight: 300;
    color: var(--text-muted); letter-spacing: -0.02em;
  }

  .sub {
    margin-top: 20px;
    font-size: 19px; line-height: 1.55;
    color: var(--text-muted);
    max-width: 560px;
  }

  /* .hero-cta + .hero-meta, mis côte à côte : la landing les empile, 630px
     de haut ne le permettent pas sans rogner le titre. */
  .actions { margin-top: 28px; display: flex; align-items: center; gap: 22px; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 15px 24px; border-radius: 100px;
    background: linear-gradient(180deg, #A565FF 0%, #7B30E5 100%);
    color: #fff; font-weight: 600; font-size: 15px;
    border: 1px solid rgba(255,255,255,0.16);
    box-shadow: 0 14px 40px -10px rgba(145,70,255,0.6), inset 0 1px 0 rgba(255,255,255,0.25);
  }
  .btn-primary svg { width: 16px; height: 16px; }
  .actions .sep { width: 1px; height: 34px; background: var(--border); }
  .actions .stat { display: flex; flex-direction: column; gap: 3px; }
  .actions .stat .num { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
  .actions .stat .lbl { font-size: 11.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }

  .foot {
    margin-top: auto;
    display: flex; align-items: center; gap: 14px;
    font-family: var(--mono); font-size: 14px;
    color: var(--text-dim); letter-spacing: .02em;
  }
  .foot .url { color: var(--violet-2); }
  .foot .sep { width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,0.22); }

  /* ── Droite : le mockup ─────────────────────── */
  .right { position: relative; height: 100%; display: flex; align-items: center; }

  .mockup-glow {
    position: absolute; inset: 10px -30px;
    border-radius: 36px;
    background: radial-gradient(60% 50% at 50% 50%, rgba(145,70,255,0.45), transparent 70%);
    filter: blur(40px);
    opacity: .8;
  }

  /* .mockup-shot : la capture réelle de l'extension, dans le cadre vitré du
     hero. Pas de rotateY comme sur la landing — la carte est lue en vignette,
     l'inclinaison brouillerait le peu de texte encore lisible. */
  .shot {
    position: relative;
    width: 470px;
    border-radius: 24px;
    overflow: hidden;
    border: 1px solid var(--border-strong);
    box-shadow: 0 60px 120px -40px rgba(145,70,255,0.55), 0 0 0 1px rgba(255,255,255,0.05), inset 0 1px 0 rgba(255,255,255,0.08);
    background: #0d0a18;
  }
  .shot img { display: block; width: 100%; height: auto; }

  /* .notif-pop, figée sur le coin bas droit de la capture. */
  .notif {
    position: absolute;
    right: -30px; bottom: 16px;
    width: 260px;
    padding: 14px;
    border-radius: 16px;
    border: 1px solid var(--border-strong);
    background: linear-gradient(180deg, rgba(40,30,68,0.96), rgba(22,16,42,0.96));
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px rgba(145,70,255,0.18);
    backdrop-filter: blur(20px);
  }
  .notif .head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .notif .head img { width: 22px; height: 22px; filter: drop-shadow(0 0 8px rgba(145,70,255,0.5)); }
  .notif .head .ttl { font-size: 12px; font-weight: 600; }
  .notif .head .now { margin-left: auto; font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); }
  .notif .body p { font-size: 13px; line-height: 1.4; color: rgba(245,243,255,0.86); }
  .notif .body strong { color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="grid"></div>
  <div class="noise"></div>
  <div class="topline"></div>

  <div class="wrap">
    <div class="left">
      <div class="brand">
        <img src="{{IMAGES}}/logo.png" alt="">
        <span class="name">StreamPulse</span>
      </div>

      <span class="eyebrow"><span class="dot"></span>{{EYEBROW}}</span>

      <h1><span class="gradient">{{H1_A}}</span><br>{{H1_B}}<br><em>{{H1_C}}</em></h1>

      <p class="sub">{{SUB}}</p>

      <div class="actions">
        <span class="btn-primary">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          {{CTA}}
        </span>
        <span class="sep"></span>
        <span class="stat">
          <span class="num">{{META_NUM}}</span>
          <span class="lbl">{{META_LBL}}</span>
        </span>
      </div>

      <div class="foot">
        <span class="url">streampulse.fr</span>
        <span class="sep"></span>
        <span>{{BROWSERS}}</span>
      </div>
    </div>

    <div class="right">
      <div class="mockup-glow"></div>

      <div class="shot">
        <img src="{{IMAGES}}/{{SHOT}}" alt="">
      </div>

      <div class="notif">
        <div class="head">
          <img src="{{IMAGES}}/logo.png" alt="">
          <span class="ttl">StreamPulse</span>
          <span class="now">{{NOTIF_TIME}}</span>
        </div>
        <div class="body">
          <p><strong>{{NOTIF_WHO}}</strong> {{NOTIF}}<br>· {{NOTIF_GAME}}</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
